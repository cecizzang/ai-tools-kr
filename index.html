<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-6N0XZCCW0J"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-6N0XZCCW0J');
  </script>
  <title>혼AI - 혼자 일하는 사람들의 AI 커뮤니티</title>
  <meta name="description" content="1인 사업자, 소상공인, 1인 개발자를 위한 AI 도구와 최신 AI 모델 소식을 한곳에 모아보는 커뮤니티, 혼AI." />
  <meta property="og:title" content="혼AI - 혼자 일하는 사람들의 AI 커뮤니티" />
  <meta property="og:description" content="1인 사업자, 소상공인, 1인 개발자를 위한 AI 도구와 최신 AI 모델 소식을 한곳에 모아보는 커뮤니티, 혼AI." />
  <meta property="og:type" content="website" />
  <meta property="og:locale" content="ko_KR" />
  <style>
    @import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=Inter:wght@400;500;600;700&display=swap');

    :root {
      --bg: #0d0d0f;
      --surface: #141418;
      --border: #1f1f28;
      --text: #e8e8f0;
      --muted: #6b6b80;
      --accent: #7c6af7;
      --green: #4ade80;
      --yellow: #fbbf24;
      --red: #f87171;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Inter', sans-serif;
      min-height: 100vh;
      padding: 40px 20px;
    }

    header {
      max-width: 900px;
      margin: 0 auto 48px;
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 16px;
      flex-wrap: wrap;
    }

    .title-block h1 {
      font-family: 'IBM Plex Mono', monospace;
      font-size: 22px;
      font-weight: 600;
      letter-spacing: -0.5px;
      color: var(--text);
    }

    .title-block p {
      font-size: 13px;
      color: var(--muted);
      margin-top: 6px;
      font-family: 'IBM Plex Mono', monospace;
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .nav-link {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: var(--accent);
      color: #fff;
      border: none;
      padding: 10px 18px;
      border-radius: 6px;
      font-size: 14px;
      font-weight: 600;
      font-family: 'IBM Plex Mono', monospace;
      letter-spacing: 0.2px;
      text-decoration: none;
      transition: opacity 0.15s, transform 0.1s;
      white-space: nowrap;
    }

    .nav-link:hover { opacity: 0.88; }
    .nav-link:active { transform: scale(0.97); }

    .nav-link.secondary {
      background: var(--surface);
      color: var(--text);
      border: 1px solid var(--border);
    }

    .donate-footer-link {
      display: inline-block;
      color: #facc15;
      opacity: 0.7;
      font-size: 13px;
      font-family: 'IBM Plex Mono', monospace;
      text-decoration: none;
      background: rgba(250, 204, 21, 0.08);
      padding: 6px 12px;
      border-radius: 999px;
      transition: opacity 0.15s;
    }

    .donate-footer-link:hover { opacity: 1; }
    .donate-footer-link:focus { outline: none; }
    .donate-footer-link:focus-visible { outline: 2px solid #facc15; outline-offset: 2px; }

    .companies {
      max-width: 900px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .board-preview {
      max-width: 900px;
      margin: 0 auto 40px;
    }

    .section-title {
      font-family: 'IBM Plex Mono', monospace;
      font-size: 15px;
      font-weight: 600;
      color: var(--text);
      margin-bottom: 12px;
    }

    .board-preview-list {
      display: flex;
      flex-direction: column;
      gap: 1px;
      background: var(--border);
      border: 1px solid var(--border);
      border-radius: 10px;
      overflow: hidden;
    }

    .board-preview-row {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 14px 20px;
      background: var(--surface);
      text-decoration: none;
      color: var(--text);
      min-width: 0;
    }

    .board-preview-row:hover { background: #1a1a20; }

    .board-preview-cat {
      font-size: 11px;
      font-family: 'IBM Plex Mono', monospace;
      color: var(--accent);
      flex-shrink: 0;
      width: 48px;
    }

    .board-preview-title {
      flex: 1;
      min-width: 0;
      font-size: 14px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .board-preview-count {
      color: var(--accent);
      font-family: 'IBM Plex Mono', monospace;
      font-size: 12px;
      margin-left: 4px;
    }

    .board-preview-meta {
      font-size: 12px;
      color: var(--muted);
      font-family: 'IBM Plex Mono', monospace;
      flex-shrink: 0;
    }

    .board-preview-empty {
      padding: 24px 20px;
      text-align: center;
      color: var(--muted);
      font-family: 'IBM Plex Mono', monospace;
      font-size: 13px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
    }

    .board-preview-empty-link {
      color: var(--accent);
      margin-left: 6px;
    }

    .board-more-link {
      display: inline-block;
      margin-top: 12px;
      font-size: 13px;
      color: var(--accent);
      font-family: 'IBM Plex Mono', monospace;
      text-decoration: none;
    }

    .board-more-link:hover { text-decoration: underline; }

    .tools-preview {
      max-width: 900px;
      margin: 0 auto 40px;
    }

    .tools-preview-head {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
      margin-bottom: 12px;
    }

    .tools-preview-chips {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .tools-chip {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 8px 14px;
      border-radius: 999px;
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--text);
      font-size: 13px;
      font-family: 'IBM Plex Mono', monospace;
      text-decoration: none;
    }

    .tools-chip:hover { border-color: var(--accent); color: var(--accent); }

    .tools-chip-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      flex-shrink: 0;
    }

    .company-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      overflow: hidden;
    }

    .company-header {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 16px 20px;
      border-bottom: 1px solid var(--border);
    }

    .company-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      flex-shrink: 0;
    }

    .company-name {
      font-family: 'IBM Plex Mono', monospace;
      font-size: 13px;
      font-weight: 600;
      color: var(--text);
      flex: 1;
    }

    .status-badge {
      font-size: 11px;
      font-family: 'IBM Plex Mono', monospace;
      padding: 3px 8px;
      border-radius: 4px;
      color: var(--muted);
      background: var(--border);
    }

    .status-badge.loading {
      color: var(--yellow);
      background: rgba(251, 191, 36, 0.1);
      animation: pulse 1.2s ease-in-out infinite;
    }

    .status-badge.done {
      color: var(--green);
      background: rgba(74, 222, 128, 0.1);
    }

    .status-badge.error {
      color: var(--red);
      background: rgba(248, 113, 113, 0.1);
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.5; }
    }

    .company-body {
      padding: 20px;
      font-size: 14px;
      line-height: 1.7;
      color: var(--text);
      white-space: pre-wrap;
      font-family: 'Inter', sans-serif;
      min-height: 60px;
    }

    .company-body.clamped {
      display: -webkit-box;
      -webkit-line-clamp: 5;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .placeholder {
      color: var(--muted);
      font-size: 13px;
      font-family: 'IBM Plex Mono', monospace;
    }

    footer {
      max-width: 900px;
      margin: 24px auto 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      text-align: center;
    }

    footer p {
      font-size: 11px;
      color: var(--muted);
      font-family: 'IBM Plex Mono', monospace;
    }

    .expand-btn {
      display: none;
      margin: 0 20px 20px;
      background: none;
      border: none;
      padding: 0;
      color: var(--accent);
      font-size: 12px;
      font-family: 'IBM Plex Mono', monospace;
      cursor: pointer;
    }

    .expand-btn:hover { text-decoration: underline; }

  </style>
</head>
<body>

<header>
  <div class="title-block">
    <h1>혼AI</h1>
    <p>Anthropic · OpenAI · Google · Meta · Mistral</p>
  </div>
  <div class="header-actions">
    <a href="board.html" class="nav-link">게시판</a>
    <a href="tools.html" class="nav-link secondary">AI 툴</a>
    <a href="contact.html" class="nav-link secondary">문의사항</a>
  </div>
</header>

<section class="board-preview">
  <h2 class="section-title">게시판 최신글</h2>
  <div class="board-preview-list" id="boardPreviewList"></div>
  <a href="board.html" class="board-more-link">게시판 더보기 →</a>
</section>

<section class="tools-preview">
  <div class="tools-preview-head">
    <h2 class="section-title">AI 툴 모음</h2>
    <a href="tools.html" class="board-more-link">전체 보기 →</a>
  </div>
  <div class="tools-preview-chips">
    <a href="tools.html?category=chat" class="tools-chip"><span class="tools-chip-dot" style="background:#7c6af7"></span>대화형 AI</a>
    <a href="tools.html?category=writing" class="tools-chip"><span class="tools-chip-dot" style="background:#10b981"></span>글쓰기·번역</a>
    <a href="tools.html?category=image" class="tools-chip"><span class="tools-chip-dot" style="background:#f59e0b"></span>이미지·디자인</a>
    <a href="tools.html?category=media" class="tools-chip"><span class="tools-chip-dot" style="background:#ec4899"></span>영상·음성</a>
    <a href="tools.html?category=dev" class="tools-chip"><span class="tools-chip-dot" style="background:#3b82f6"></span>코딩·개발</a>
    <a href="tools.html?category=automation" class="tools-chip"><span class="tools-chip-dot" style="background:#fbbf24"></span>자동화·업무</a>
    <a href="tools.html?category=docs" class="tools-chip"><span class="tools-chip-dot" style="background:#94a3b8"></span>문서·회의</a>
  </div>
</section>

<div class="companies" id="companies"></div>

<footer>
  <a
    class="donate-footer-link"
    id="donateBtn"
    href="https://buymeacoffee.com/cecizzang"
    target="_blank"
    rel="noopener noreferrer"
    onclick="logUsage('donate_click')"
  >☕ 커피 한 잔 후원하기</a>
  <p>회사 소식은 AI가 자동 요약한 정보로 부정확할 수 있습니다</p>
</footer>

<script>
  // Publishable key is safe to expose client-side by design (RLS enforces access control server-side).
  const SUPABASE_URL = 'https://clpwrmxegqvzzcqcxdsa.supabase.co';
  const SUPABASE_ANON_KEY = 'sb_publishable_PiSGtCuULXpdHlOgYdWK0A_jmTgqIXQ';

  function getSessionId() {
    try {
      let id = localStorage.getItem('atk_session_id');
      if (!id) {
        id = crypto.randomUUID();
        localStorage.setItem('atk_session_id', id);
      }
      return id;
    } catch {
      return null; // localStorage unavailable (e.g. private browsing) — log without a session id
    }
  }

  function logUsage(eventType, companyId = null) {
    if (!SUPABASE_URL || SUPABASE_URL.includes('YOUR_PROJECT')) return; // not configured yet

    fetch(`${SUPABASE_URL}/rest/v1/usage_logs`, {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        apikey: SUPABASE_ANON_KEY,
        Authorization: `Bearer ${SUPABASE_ANON_KEY}`,
        Prefer: 'return=minimal',
      },
      body: JSON.stringify({ event_type: eventType, company_id: companyId, session_id: getSessionId() }),
    }).catch(() => {}); // best-effort logging — never block the user's action on this failing
  }

  const POST_CATEGORY_LABELS = { notice: '공지사항', free: '일반', dev: '개발' };

  async function fetchPosts(url) {
    const res = await fetch(url, {
      headers: {
        apikey: SUPABASE_ANON_KEY,
        Authorization: `Bearer ${SUPABASE_ANON_KEY}`,
      },
    });
    if (!res.ok) throw new Error(`status ${res.status}`);
    return res.json();
  }

  function buildPreviewRow(row) {
    const a = document.createElement('a');
    a.className = 'board-preview-row';
    a.href = `post.html?id=${encodeURIComponent(row.id)}`;

    const cat = document.createElement('span');
    cat.className = 'board-preview-cat';
    cat.textContent = POST_CATEGORY_LABELS[row.category] || row.category;

    const title = document.createElement('span');
    title.className = 'board-preview-title';
    title.textContent = row.title;

    const commentCount = row.comments?.length || 0;
    if (commentCount > 0) {
      const count = document.createElement('span');
      count.className = 'board-preview-count';
      count.textContent = `[${commentCount}]`;
      title.appendChild(count);
    }

    const meta = document.createElement('span');
    meta.className = 'board-preview-meta';
    meta.textContent = `${row.nickname} · ${formatRelativeTime(row.created_at)}`;

    a.appendChild(cat);
    a.appendChild(title);
    a.appendChild(meta);
    return a;
  }

  function buildPreviewEmpty() {
    const wrap = document.createElement('div');
    wrap.className = 'board-preview-empty';
    wrap.append('아직 글이 없습니다. 첫 글을 남겨주세요 ');
    const link = document.createElement('a');
    link.href = 'write.html';
    link.className = 'board-preview-empty-link';
    link.textContent = '글쓰기';
    wrap.appendChild(link);
    return wrap;
  }

  async function loadBoardPreview() {
    const listEl = document.getElementById('boardPreviewList');
    // comments(count) triggers a Postgres count(*) permission check that the
    // column-restricted comments grant doesn't satisfy — fetch comments(id)
    // and count client-side instead (same fix as board.html).
    const select = 'select=id,category,nickname,title,created_at,comments(id)';

    try {
      const [noticeRows, postRows] = await Promise.all([
        fetchPosts(`${SUPABASE_URL}/rest/v1/posts?${select}&category=eq.notice&order=created_at.desc&limit=1`),
        fetchPosts(`${SUPABASE_URL}/rest/v1/posts?${select}&category=neq.notice&order=created_at.desc&limit=5`),
      ]);

      const rows = [...noticeRows, ...postRows];
      listEl.textContent = '';

      if (rows.length === 0) {
        listEl.appendChild(buildPreviewEmpty());
        return;
      }

      rows.forEach((row) => listEl.appendChild(buildPreviewRow(row)));
    } catch (err) {
      listEl.textContent = '';
      const empty = document.createElement('div');
      empty.className = 'board-preview-empty';
      empty.textContent = '게시글을 불러오지 못했습니다.';
      listEl.appendChild(empty);
    }
  }

  const COMPANIES = [
    { id: 'anthropic', name: 'Anthropic', color: '#7c6af7' },
    { id: 'openai',    name: 'OpenAI',    color: '#10b981' },
    { id: 'google',    name: 'Google DeepMind', color: '#3b82f6' },
    { id: 'meta',      name: 'Meta AI',   color: '#f59e0b' },
    { id: 'mistral',   name: 'Mistral AI', color: '#ec4899' },
  ];

  function initCards() {
    const container = document.getElementById('companies');
    container.innerHTML = COMPANIES.map(c => `
      <div class="company-card" id="card-${c.id}">
        <div class="company-header">
          <div class="company-dot" style="background:${c.color}"></div>
          <span class="company-name">${c.name}</span>
          <span class="status-badge" id="status-${c.id}">불러오는 중</span>
        </div>
        <div class="company-body placeholder" id="body-${c.id}"></div>
        <button class="expand-btn" id="expand-${c.id}" onclick="toggleExpand('${c.id}')">더보기</button>
      </div>
    `).join('');
    COMPANIES.forEach(c => {
      setStatus(c.id, 'loading');
      setBody(c.id, '불러오는 중...', { placeholder: true });
    });
  }

  function setStatus(id, state, text) {
    const el = document.getElementById(`status-${id}`);
    el.className = 'status-badge';
    if (state === 'loading') { el.classList.add('loading'); el.textContent = text || '불러오는 중'; }
    else if (state === 'done') { el.classList.add('done'); el.textContent = text || '업데이트됨'; }
    else if (state === 'error') { el.classList.add('error'); el.textContent = text || '오류'; }
    else { el.textContent = text || '대기중'; }
  }

  // Sets card body text. `text` may come from web-search results (untrusted),
  // so it's always inserted via textContent — never parsed as HTML.
  function setBody(id, text, { placeholder = false } = {}) {
    const el = document.getElementById(`body-${id}`);
    const btn = document.getElementById(`expand-${id}`);
    el.textContent = text;
    el.classList.toggle('placeholder', placeholder);
    btn.textContent = '더보기';
    btn.style.display = 'none';

    if (placeholder) {
      el.classList.remove('clamped');
      return;
    }

    el.classList.add('clamped');
    requestAnimationFrame(() => {
      if (el.scrollHeight > el.clientHeight + 1) {
        btn.style.display = 'block';
      }
    });
  }

  function toggleExpand(id) {
    const el = document.getElementById(`body-${id}`);
    const btn = document.getElementById(`expand-${id}`);
    const stillClamped = el.classList.toggle('clamped');
    btn.textContent = stillClamped ? '더보기' : '접기';
  }

  function formatRelativeTime(iso) {
    const diffMin = Math.floor((Date.now() - new Date(iso).getTime()) / 60000);
    if (diffMin < 1) return '방금 전';
    if (diffMin < 60) return `${diffMin}분 전`;
    const diffHour = Math.floor(diffMin / 60);
    if (diffHour < 24) return `${diffHour}시간 전`;
    const diffDay = Math.floor(diffHour / 24);
    return `${diffDay}일 전`;
  }

  async function loadUpdates() {
    try {
      const res = await fetch(`${SUPABASE_URL}/rest/v1/company_updates?select=*`, {
        headers: {
          apikey: SUPABASE_ANON_KEY,
          Authorization: `Bearer ${SUPABASE_ANON_KEY}`,
        },
      });

      if (!res.ok) throw new Error(`status ${res.status}`);

      const rows = await res.json();
      const byId = Object.fromEntries(rows.map(r => [r.company_id, r]));

      COMPANIES.forEach(c => {
        const row = byId[c.id];
        if (row) {
          setBody(c.id, row.summary);
          setStatus(c.id, 'done', `업데이트: ${formatRelativeTime(row.fetched_at)}`);
        } else {
          setBody(c.id, '곧 업데이트됩니다', { placeholder: true });
          setStatus(c.id, 'idle', '대기중');
        }
      });
    } catch (err) {
      COMPANIES.forEach(c => {
        setBody(c.id, '정보를 불러오지 못했습니다.', { placeholder: true });
        setStatus(c.id, 'error');
      });
    }
  }

  initCards();
  loadUpdates();
  loadBoardPreview();
</script>
</body>
</html>
