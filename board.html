<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-6N0XZCCW0J"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-6N0XZCCW0J');
  </script>
  <meta name="description" content="AI 툴 후기, 추천, 자동화와 사이드 프로젝트 이야기를 나누는 혼AI 게시판. 가입 없이 글쓰기." />
  <meta property="og:title" content="게시판 - 혼AI" />
  <meta property="og:description" content="AI 툴 후기, 추천, 자동화와 사이드 프로젝트 이야기를 나누는 혼AI 게시판. 가입 없이 글쓰기." />
  <meta property="og:type" content="website" />
  <meta property="og:locale" content="ko_KR" />
  <link rel="canonical" href="https://ai-tools-kr-rho.vercel.app/board.html" />
  <title>게시판 - 혼AI</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=Inter:wght@400;500;600;700&display=swap');

    :root {
      --bg: #0d0d0f;
      --surface: #141418;
      --border: #1f1f28;
      --text: #e8e8f0;
      --muted: #6b6b80;
      --accent: #7c6af7;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Inter', sans-serif;
      min-height: 100vh;
      padding: 40px 20px;
    }

    header {
      max-width: 900px;
      margin: 0 auto 32px;
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 16px;
      flex-wrap: wrap;
    }

    .title-block a { text-decoration: none; color: inherit; }

    .title-block h1 {
      font-family: 'IBM Plex Mono', monospace;
      font-size: 22px;
      font-weight: 600;
      letter-spacing: -0.5px;
      color: var(--text);
    }

    .title-block p {
      font-size: 13px;
      color: var(--muted);
      margin-top: 6px;
      font-family: 'IBM Plex Mono', monospace;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: var(--accent);
      color: #fff;
      border: none;
      padding: 10px 18px;
      border-radius: 6px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      font-family: 'IBM Plex Mono', monospace;
      letter-spacing: 0.2px;
      text-decoration: none;
      transition: opacity 0.15s, transform 0.1s;
      white-space: nowrap;
    }

    .btn:hover { opacity: 0.88; }
    .btn:active { transform: scale(0.97); }

    .btn.secondary {
      background: var(--surface);
      color: var(--text);
      border: 1px solid var(--border);
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .tabs {
      max-width: 900px;
      margin: 0 auto 20px;
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .tab {
      padding: 6px 14px;
      border-radius: 6px;
      font-size: 13px;
      font-family: 'IBM Plex Mono', monospace;
      color: var(--muted);
      text-decoration: none;
      background: var(--surface);
      border: 1px solid var(--border);
    }

    .tab.active {
      color: #fff;
      background: var(--accent);
      border-color: var(--accent);
    }

    .post-list {
      max-width: 900px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 1px;
      background: var(--border);
      border: 1px solid var(--border);
      border-radius: 10px;
      overflow: hidden;
    }

    .post-row {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 14px 20px;
      background: var(--surface);
      text-decoration: none;
      color: var(--text);
    }

    .post-row:hover { background: #1a1a20; }

    .post-row .cat {
      font-size: 11px;
      font-family: 'IBM Plex Mono', monospace;
      color: var(--accent);
      flex-shrink: 0;
      width: 56px;
    }

    .official-badge {
      display: inline-block;
      font-family: 'IBM Plex Mono', monospace;
      font-size: 10px;
      line-height: 1.5;
      color: var(--accent);
      border: 1px solid var(--accent);
      border-radius: 4px;
      padding: 0 5px;
      margin-right: 6px;
      vertical-align: 1px;
    }

    .post-row .title {
      flex: 1;
      font-size: 14px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .post-row .count {
      color: var(--accent);
      font-family: 'IBM Plex Mono', monospace;
      font-size: 12px;
      margin-left: 4px;
    }

    .post-row .meta {
      font-size: 12px;
      color: var(--muted);
      font-family: 'IBM Plex Mono', monospace;
      flex-shrink: 0;
    }

    .empty {
      max-width: 900px;
      margin: 40px auto;
      text-align: center;
      color: var(--muted);
      font-family: 'IBM Plex Mono', monospace;
      font-size: 13px;
    }

    .pagination {
      max-width: 900px;
      margin: 20px auto 0;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 16px;
      font-family: 'IBM Plex Mono', monospace;
      font-size: 13px;
      color: var(--muted);
    }

    .pagination a { color: var(--text); text-decoration: none; }
    .pagination a:hover { color: var(--accent); }
    /* 공통: 한국어가 단어 중간에서 끊기지 않게 + 아이폰에서 입력창 누를 때 화면 확대 방지 */
    body { word-break: keep-all; overflow-wrap: anywhere; }
    @media (max-width: 600px) {
      input, textarea, select { font-size: 16px !important; }
    }
  </style>
</head>
<body>

<header>
  <div class="title-block">
    <a href="index.html"><h1>혼AI</h1></a>
    <p>게시판</p>
  </div>
  <div class="header-actions">
    <a href="tools.html" class="btn secondary">AI 툴</a>
    <a href="write.html" class="btn">글쓰기</a>
  </div>
</header>

<div class="tabs" id="tabs"></div>
<div class="post-list" id="postList"></div>
<div class="pagination" id="pagination"></div>

<script src="official.js"></script>
<script src="pagination.js"></script>
<script>
  const SUPABASE_URL = 'https://clpwrmxegqvzzcqcxdsa.supabase.co';
  const SUPABASE_ANON_KEY = 'sb_publishable_PiSGtCuULXpdHlOgYdWK0A_jmTgqIXQ';
  const PAGE_SIZE = 20;
  const CATEGORY_LABELS = { notice: '공지사항', free: '일반', dev: '개발', business: '사장님 모임' };

  function getParams() {
    const p = new URLSearchParams(location.search);
    return {
      category: p.get('category') || 'all',
      page: Math.max(1, parseInt(p.get('page') || '1', 10) || 1),
    };
  }

  function formatRelativeTime(iso) {
    const diffMin = Math.floor((Date.now() - new Date(iso).getTime()) / 60000);
    if (diffMin < 1) return '방금 전';
    if (diffMin < 60) return `${diffMin}분 전`;
    const diffHour = Math.floor(diffMin / 60);
    if (diffHour < 24) return `${diffHour}시간 전`;
    const diffDay = Math.floor(diffHour / 24);
    return `${diffDay}일 전`;
  }

  function renderTabs(active) {
    const tabsEl = document.getElementById('tabs');
    tabsEl.textContent = '';
    [['all', '전체'], ['notice', '공지사항'], ['free', '일반'], ['dev', '개발']].forEach(([id, label]) => {
      const a = document.createElement('a');
      a.className = 'tab' + (id === active ? ' active' : '');
      a.textContent = label;
      a.href = id === 'all' ? 'board.html' : `board.html?category=${id}`;
      tabsEl.appendChild(a);
    });

    const contact = document.createElement('a');
    contact.className = 'tab';
    contact.textContent = '문의사항';
    contact.href = 'contact.html';
    tabsEl.appendChild(contact);
  }

  function buildRow(row) {
    const a = document.createElement('a');
    a.className = 'post-row';
    a.href = `post.html?id=${encodeURIComponent(row.id)}`;

    const cat = document.createElement('span');
    cat.className = 'cat';
    cat.textContent = CATEGORY_LABELS[row.category] || row.category;

    const title = document.createElement('span');
    title.className = 'title';
    title.textContent = row.title;

    const commentCount = row.comments?.length || 0;
    if (commentCount > 0) {
      const count = document.createElement('span');
      count.className = 'count';
      count.textContent = `[${commentCount}]`;
      title.appendChild(count);
    }

    const meta = document.createElement('span');
    meta.className = 'meta';
    if (OfficialPosts.isOfficial(row)) meta.appendChild(OfficialPosts.officialBadge());
    meta.appendChild(document.createTextNode(`${row.nickname} · ${formatRelativeTime(row.created_at)}`));

    a.appendChild(cat);
    a.appendChild(title);
    a.appendChild(meta);
    return a;
  }

  function renderPagination(page, total, category) {
    const el = document.getElementById('pagination');
    el.textContent = '';
    // 총 페이지가 1 이하면 "이전 1 / 1 다음"을 아예 보여 주지 않는다.
    const visible = Pagination.shouldShowPagination(page, total, PAGE_SIZE);
    el.style.display = visible ? '' : 'none';
    if (!visible) return;
    const totalPages = Pagination.totalPages(total, PAGE_SIZE);
    const qs = category !== 'all' ? `category=${category}&` : '';

    if (page > 1) {
      const prev = document.createElement('a');
      prev.textContent = '이전';
      prev.href = `board.html?${qs}page=${page - 1}`;
      el.appendChild(prev);
    } else {
      const span = document.createElement('span');
      span.textContent = '이전';
      span.style.opacity = '0.4';
      el.appendChild(span);
    }

    const info = document.createElement('span');
    info.textContent = `${page} / ${totalPages}`;
    el.appendChild(info);

    if (page < totalPages) {
      const next = document.createElement('a');
      next.textContent = '다음';
      next.href = `board.html?${qs}page=${page + 1}`;
      el.appendChild(next);
    } else {
      const span = document.createElement('span');
      span.textContent = '다음';
      span.style.opacity = '0.4';
      el.appendChild(span);
    }
  }

  // query는 select 뒤에 붙는 조건·정렬. 운영자 배지를 위해 is_official도 같이 읽는다.
  async function fetchPosts(query) {
    const buildUrl = (official) =>
      `${SUPABASE_URL}/rest/v1/posts?select=id,category,nickname,title,created_at${official ? ',is_official' : ''},comments(id)&${query}`;
    const { res } = await OfficialPosts.fetchWithOfficial(buildUrl, (url) => fetch(url, {
      headers: {
        apikey: SUPABASE_ANON_KEY,
        Authorization: `Bearer ${SUPABASE_ANON_KEY}`,
        Prefer: 'count=exact',
      },
    }));
    if (!res.ok) throw new Error(`status ${res.status}`);
    const rows = await res.json();
    const range = res.headers.get('content-range');
    const total = range ? parseInt(range.split('/')[1], 10) : rows.length;
    return { rows, total };
  }

  async function loadPosts() {
    const { category, page } = getParams();
    renderTabs(category);

    const offset = (page - 1) * PAGE_SIZE;
    let query = `order=created_at.desc&limit=${PAGE_SIZE}&offset=${offset}`;
    query += category === 'all' ? '&category=neq.notice' : `&category=eq.${category}`;

    const listEl = document.getElementById('postList');
    listEl.textContent = '';

    try {
      if (category === 'all' && page === 1) {
        const { rows: noticeRows } = await fetchPosts('category=eq.notice&order=created_at.desc&limit=5');
        noticeRows.forEach((row) => listEl.appendChild(buildRow(row)));
      }

      const { rows, total } = await fetchPosts(query);

      if (rows.length === 0 && listEl.children.length === 0) {
        const empty = document.createElement('div');
        empty.className = 'empty';
        empty.textContent = '아직 게시글이 없습니다.';
        listEl.appendChild(empty);
      } else {
        rows.forEach((row) => listEl.appendChild(buildRow(row)));
      }

      renderPagination(page, total, category);
    } catch (err) {
      listEl.textContent = '';
      const empty = document.createElement('div');
      empty.className = 'empty';
      empty.textContent = '목록을 불러오지 못했습니다.';
      listEl.appendChild(empty);
    }
  }

  loadPosts();
</script>
</body>
</html>
