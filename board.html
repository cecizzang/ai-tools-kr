<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>게시판 - 혼AI</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=Inter:wght@400;500;600;700&display=swap');

    :root {
      --bg: #0d0d0f;
      --surface: #141418;
      --border: #1f1f28;
      --text: #e8e8f0;
      --muted: #6b6b80;
      --accent: #7c6af7;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Inter', sans-serif;
      min-height: 100vh;
      padding: 40px 20px;
    }

    header {
      max-width: 900px;
      margin: 0 auto 32px;
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 16px;
      flex-wrap: wrap;
    }

    .title-block a { text-decoration: none; color: inherit; }

    .title-block h1 {
      font-family: 'IBM Plex Mono', monospace;
      font-size: 22px;
      font-weight: 600;
      letter-spacing: -0.5px;
      color: var(--text);
    }

    .title-block p {
      font-size: 13px;
      color: var(--muted);
      margin-top: 6px;
      font-family: 'IBM Plex Mono', monospace;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: var(--accent);
      color: #fff;
      border: none;
      padding: 10px 18px;
      border-radius: 6px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      font-family: 'IBM Plex Mono', monospace;
      letter-spacing: 0.2px;
      text-decoration: none;
      transition: opacity 0.15s, transform 0.1s;
      white-space: nowrap;
    }

    .btn:hover { opacity: 0.88; }
    .btn:active { transform: scale(0.97); }

    .tabs {
      max-width: 900px;
      margin: 0 auto 20px;
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .tab {
      padding: 6px 14px;
      border-radius: 6px;
      font-size: 13px;
      font-family: 'IBM Plex Mono', monospace;
      color: var(--muted);
      text-decoration: none;
      background: var(--surface);
      border: 1px solid var(--border);
    }

    .tab.active {
      color: #fff;
      background: var(--accent);
      border-color: var(--accent);
    }

    .post-list {
      max-width: 900px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 1px;
      background: var(--border);
      border: 1px solid var(--border);
      border-radius: 10px;
      overflow: hidden;
    }

    .post-row {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 14px 20px;
      background: var(--surface);
      text-decoration: none;
      color: var(--text);
    }

    .post-row:hover { background: #1a1a20; }

    .post-row .cat {
      font-size: 11px;
      font-family: 'IBM Plex Mono', monospace;
      color: var(--accent);
      flex-shrink: 0;
      width: 56px;
    }

    .post-row .title {
      flex: 1;
      font-size: 14px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .post-row .meta {
      font-size: 12px;
      color: var(--muted);
      font-family: 'IBM Plex Mono', monospace;
      flex-shrink: 0;
    }

    .empty {
      max-width: 900px;
      margin: 40px auto;
      text-align: center;
      color: var(--muted);
      font-family: 'IBM Plex Mono', monospace;
      font-size: 13px;
    }

    .pagination {
      max-width: 900px;
      margin: 20px auto 0;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 16px;
      font-family: 'IBM Plex Mono', monospace;
      font-size: 13px;
      color: var(--muted);
    }

    .pagination a { color: var(--text); text-decoration: none; }
    .pagination a:hover { color: var(--accent); }
  </style>
</head>
<body>

<header>
  <div class="title-block">
    <a href="index.html"><h1>// 혼AI</h1></a>
    <p>게시판</p>
  </div>
  <a href="write.html" class="btn">글쓰기</a>
</header>

<div class="tabs" id="tabs"></div>
<div class="post-list" id="postList"></div>
<div class="pagination" id="pagination"></div>

<script>
  const SUPABASE_URL = 'https://clpwrmxegqvzzcqcxdsa.supabase.co';
  const SUPABASE_ANON_KEY = 'sb_publishable_PiSGtCuULXpdHlOgYdWK0A_jmTgqIXQ';
  const PAGE_SIZE = 20;
  const CATEGORY_LABELS = { business: '장사', dev: '개발', scam: '사기제보', free: '자유' };

  function getParams() {
    const p = new URLSearchParams(location.search);
    return {
      category: p.get('category') || 'all',
      page: Math.max(1, parseInt(p.get('page') || '1', 10) || 1),
    };
  }

  function formatRelativeTime(iso) {
    const diffMin = Math.floor((Date.now() - new Date(iso).getTime()) / 60000);
    if (diffMin < 1) return '방금 전';
    if (diffMin < 60) return `${diffMin}분 전`;
    const diffHour = Math.floor(diffMin / 60);
    if (diffHour < 24) return `${diffHour}시간 전`;
    const diffDay = Math.floor(diffHour / 24);
    return `${diffDay}일 전`;
  }

  function renderTabs(active) {
    const tabsEl = document.getElementById('tabs');
    tabsEl.textContent = '';
    [['all', '전체'], ['business', '장사'], ['dev', '개발'], ['scam', '사기제보'], ['free', '자유']].forEach(([id, label]) => {
      const a = document.createElement('a');
      a.className = 'tab' + (id === active ? ' active' : '');
      a.textContent = label;
      a.href = id === 'all' ? 'board.html' : `board.html?category=${id}`;
      tabsEl.appendChild(a);
    });
  }

  function buildRow(row) {
    const a = document.createElement('a');
    a.className = 'post-row';
    a.href = `post.html?id=${encodeURIComponent(row.id)}`;

    const cat = document.createElement('span');
    cat.className = 'cat';
    cat.textContent = CATEGORY_LABELS[row.category] || row.category;

    const title = document.createElement('span');
    title.className = 'title';
    title.textContent = row.title;

    const meta = document.createElement('span');
    meta.className = 'meta';
    meta.textContent = `${row.nickname} · ${formatRelativeTime(row.created_at)}`;

    a.appendChild(cat);
    a.appendChild(title);
    a.appendChild(meta);
    return a;
  }

  function renderPagination(page, total, category) {
    const el = document.getElementById('pagination');
    el.textContent = '';
    const totalPages = Math.max(1, Math.ceil(total / PAGE_SIZE));
    const qs = category !== 'all' ? `category=${category}&` : '';

    if (page > 1) {
      const prev = document.createElement('a');
      prev.textContent = '이전';
      prev.href = `board.html?${qs}page=${page - 1}`;
      el.appendChild(prev);
    } else {
      const span = document.createElement('span');
      span.textContent = '이전';
      span.style.opacity = '0.4';
      el.appendChild(span);
    }

    const info = document.createElement('span');
    info.textContent = `${page} / ${totalPages}`;
    el.appendChild(info);

    if (page < totalPages) {
      const next = document.createElement('a');
      next.textContent = '다음';
      next.href = `board.html?${qs}page=${page + 1}`;
      el.appendChild(next);
    } else {
      const span = document.createElement('span');
      span.textContent = '다음';
      span.style.opacity = '0.4';
      el.appendChild(span);
    }
  }

  async function loadPosts() {
    const { category, page } = getParams();
    renderTabs(category);

    const offset = (page - 1) * PAGE_SIZE;
    let url = `${SUPABASE_URL}/rest/v1/posts?select=id,category,nickname,title,created_at&order=created_at.desc&limit=${PAGE_SIZE}&offset=${offset}`;
    if (category !== 'all') url += `&category=eq.${category}`;

    const listEl = document.getElementById('postList');
    listEl.textContent = '';

    try {
      const res = await fetch(url, {
        headers: {
          apikey: SUPABASE_ANON_KEY,
          Authorization: `Bearer ${SUPABASE_ANON_KEY}`,
          Prefer: 'count=exact',
        },
      });
      if (!res.ok) throw new Error(`status ${res.status}`);

      const rows = await res.json();
      const range = res.headers.get('content-range');
      const total = range ? parseInt(range.split('/')[1], 10) : rows.length;

      if (rows.length === 0) {
        const empty = document.createElement('div');
        empty.className = 'empty';
        empty.textContent = '아직 게시글이 없습니다.';
        listEl.appendChild(empty);
      } else {
        rows.forEach((row) => listEl.appendChild(buildRow(row)));
      }

      renderPagination(page, total, category);
    } catch (err) {
      const empty = document.createElement('div');
      empty.className = 'empty';
      empty.textContent = '목록을 불러오지 못했습니다.';
      listEl.appendChild(empty);
    }
  }

  loadPosts();
</script>
</body>
</html>
