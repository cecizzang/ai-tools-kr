<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>글쓰기 - 혼AI</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=Inter:wght@400;500;600;700&display=swap');

    :root {
      --bg: #0d0d0f;
      --surface: #141418;
      --border: #1f1f28;
      --text: #e8e8f0;
      --muted: #6b6b80;
      --accent: #7c6af7;
      --red: #f87171;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Inter', sans-serif;
      min-height: 100vh;
      padding: 40px 20px;
    }

    header {
      max-width: 900px;
      margin: 0 auto 32px;
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 16px;
      flex-wrap: wrap;
    }

    .title-block a { text-decoration: none; color: inherit; }

    .title-block h1 {
      font-family: 'IBM Plex Mono', monospace;
      font-size: 22px;
      font-weight: 600;
      letter-spacing: -0.5px;
      color: var(--text);
    }

    .title-block p {
      font-size: 13px;
      color: var(--muted);
      margin-top: 6px;
      font-family: 'IBM Plex Mono', monospace;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: var(--accent);
      color: #fff;
      border: none;
      padding: 10px 18px;
      border-radius: 6px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      font-family: 'IBM Plex Mono', monospace;
      letter-spacing: 0.2px;
      text-decoration: none;
      transition: opacity 0.15s, transform 0.1s;
      white-space: nowrap;
    }

    .btn:hover { opacity: 0.88; }
    .btn:active { transform: scale(0.97); }
    .btn:disabled { opacity: 0.4; cursor: not-allowed; }

    #submitBtn { align-self: flex-end; }

    .btn.secondary {
      background: var(--surface);
      color: var(--text);
      border: 1px solid var(--border);
    }

    form {
      max-width: 900px;
      margin: 0 auto;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 24px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    label {
      font-size: 12px;
      font-family: 'IBM Plex Mono', monospace;
      color: var(--muted);
      display: block;
      margin-bottom: 6px;
    }

    .form-row { display: flex; gap: 14px; flex-wrap: wrap; }
    .form-row > div { flex: 1; min-width: 160px; }

    select, input, textarea {
      width: 100%;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 6px;
      color: var(--text);
      font-family: 'Inter', sans-serif;
      font-size: 14px;
      padding: 10px 12px;
    }

    textarea { resize: vertical; min-height: 200px; font-family: inherit; }

    select:focus, input:focus, textarea:focus { outline: 1px solid var(--accent); }

    .form-error {
      font-size: 12px;
      color: var(--red);
      font-family: 'IBM Plex Mono', monospace;
      min-height: 16px;
    }

    .hp-field { position: absolute; left: -9999px; top: -9999px; }

    .image-hint {
      font-size: 11px;
      color: var(--muted);
      font-family: 'IBM Plex Mono', monospace;
      margin-top: 6px;
    }

    .image-row {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
    }

    .image-preview,
    .add-image-btn {
      width: 84px;
      height: 84px;
      border-radius: 6px;
      flex: 0 0 auto;
    }

    .image-preview {
      position: relative;
      overflow: hidden;
      border: 1px solid var(--border);
    }

    .image-preview img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .image-preview button {
      position: absolute;
      top: 2px;
      right: 2px;
      width: 20px;
      height: 20px;
      border-radius: 50%;
      border: none;
      background: rgba(0, 0, 0, 0.65);
      color: #fff;
      font-size: 13px;
      line-height: 1;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .image-preview button:hover { background: var(--red); }

    .add-image-btn {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 4px;
      background: var(--bg);
      border: 1px dashed var(--border);
      color: var(--muted);
      font-family: 'IBM Plex Mono', monospace;
      font-size: 11px;
      cursor: pointer;
      transition: border-color 0.15s, color 0.15s;
    }

    .add-image-btn:hover { border-color: var(--accent); color: var(--accent); }

    .add-image-btn .plus { font-size: 20px; line-height: 1; }

    .body-field.drag-over textarea { outline: 1px dashed var(--accent); }
  </style>
</head>
<body>

<header>
  <div class="title-block">
    <a href="index.html"><h1>혼AI</h1></a>
    <p>글쓰기</p>
  </div>
  <a href="board.html" class="btn secondary">목록</a>
</header>

<form id="writeForm">
  <div>
    <label for="category">카테고리</label>
    <select name="category" id="category">
      <option value="free">일반</option>
      <option value="dev">개발</option>
    </select>
  </div>

  <div class="form-row">
    <div>
      <label for="nickname">닉네임</label>
      <input name="nickname" id="nickname" maxlength="12" placeholder="2~12자" required />
    </div>
    <div>
      <label for="password">비밀번호</label>
      <input name="password" id="password" type="password" maxlength="20" placeholder="4~20자 (삭제 시 필요)" required />
    </div>
  </div>

  <div>
    <label for="title">제목</label>
    <input name="title" id="title" maxlength="60" placeholder="2~60자" required />
  </div>

  <div class="body-field" id="bodyField">
    <label for="body">본문</label>
    <textarea name="body" id="body" maxlength="5000" placeholder="2~5000자 (이미지를 드래그하거나 붙여넣기 할 수 있습니다)" required></textarea>
  </div>

  <div>
    <label for="addImageBtn">이미지</label>
    <div class="image-row" id="imageRow">
      <button type="button" class="add-image-btn" id="addImageBtn">
        <span class="plus">+</span>
        <span>이미지 추가</span>
      </button>
    </div>
    <input type="file" id="imageInput" accept="image/jpeg,image/png,image/webp,image/gif" multiple hidden />
    <div class="image-hint" id="imageHint">최대 4장 · jpg, png, webp, gif · 장당 5MB 이하</div>
  </div>

  <div class="hp-field"><input name="website" tabindex="-1" autocomplete="off" /></div>

  <div class="form-error" id="writeError"></div>

  <button type="submit" class="btn" id="submitBtn">등록</button>
</form>

<script>
  const MAX_IMAGES = 4;
  const MAX_ORIGINAL_BYTES = 5 * 1024 * 1024;
  const MAX_EDGE = 1600;
  const WEBP_QUALITY = 0.82;
  const ALLOWED_TYPES = ['image/jpeg', 'image/png', 'image/webp', 'image/gif'];

  // Selected images live here as compressed webp Blobs, not the original Files —
  // by the time this array is read for submit, every entry is already resized
  // and re-encoded. Kept in module scope so the file <input> (which the browser
  // won't let us programmatically add/remove entries from) never has to be the
  // source of truth for "what's currently attached".
  let selectedImages = [];

  function loadImageElement(file) {
    return new Promise((resolve, reject) => {
      const url = URL.createObjectURL(file);
      const img = new Image();
      img.onload = () => resolve({ img, url });
      img.onerror = () => { URL.revokeObjectURL(url); reject(new Error('이미지를 불러올 수 없습니다.')); };
      img.src = url;
    });
  }

  async function resizeAndCompressToWebp(file) {
    const { img, url } = await loadImageElement(file);
    try {
      const scale = Math.min(1, MAX_EDGE / Math.max(img.naturalWidth, img.naturalHeight));
      const outW = Math.max(1, Math.round(img.naturalWidth * scale));
      const outH = Math.max(1, Math.round(img.naturalHeight * scale));

      const canvas = document.createElement('canvas');
      canvas.width = outW;
      canvas.height = outH;
      canvas.getContext('2d').drawImage(img, 0, 0, outW, outH);

      const blob = await new Promise((resolve, reject) => {
        canvas.toBlob((b) => (b ? resolve(b) : reject(new Error('이미지 압축에 실패했습니다.'))), 'image/webp', WEBP_QUALITY);
      });
      return blob;
    } finally {
      URL.revokeObjectURL(url);
    }
  }

  const DEFAULT_IMAGE_HINT = '최대 4장 · jpg, png, webp, gif · 장당 5MB 이하';

  function renderImagePreviews() {
    const row = document.getElementById('imageRow');
    const addBtn = document.getElementById('addImageBtn');

    row.querySelectorAll('.image-preview').forEach((el) => el.remove());

    selectedImages.forEach((entry, idx) => {
      const cell = document.createElement('div');
      cell.className = 'image-preview';

      const img = document.createElement('img');
      img.src = entry.previewUrl;

      const removeBtn = document.createElement('button');
      removeBtn.type = 'button';
      removeBtn.textContent = '×';
      removeBtn.setAttribute('aria-label', '이미지 제거');
      removeBtn.onclick = () => {
        URL.revokeObjectURL(entry.previewUrl);
        selectedImages.splice(idx, 1);
        renderImagePreviews();
      };

      cell.appendChild(img);
      cell.appendChild(removeBtn);
      row.insertBefore(cell, addBtn);
    });

    addBtn.style.display = selectedImages.length >= MAX_IMAGES ? 'none' : '';
  }

  // Shared by the file picker, drag-and-drop onto the body field, and pasting
  // into it — all three just need to hand a list of Files here.
  async function addFiles(fileList) {
    const hintEl = document.getElementById('imageHint');
    const files = Array.from(fileList || []);
    let message = '';

    for (const file of files) {
      if (selectedImages.length >= MAX_IMAGES) {
        message = `이미지는 최대 ${MAX_IMAGES}장까지 첨부할 수 있습니다.`;
        break;
      }
      if (!ALLOWED_TYPES.includes(file.type)) {
        message = 'jpg, png, webp, gif 형식만 첨부할 수 있습니다.';
        continue;
      }
      if (file.size > MAX_ORIGINAL_BYTES) {
        message = '이미지는 5MB를 초과할 수 없습니다.';
        continue;
      }

      try {
        const compressed = await resizeAndCompressToWebp(file);
        selectedImages.push({ blob: compressed, previewUrl: URL.createObjectURL(compressed) });
      } catch (err) {
        message = '이미지를 처리하지 못했습니다.';
      }
    }

    hintEl.textContent = message || DEFAULT_IMAGE_HINT;
    renderImagePreviews();
  }

  const imageInput = document.getElementById('imageInput');
  document.getElementById('addImageBtn').addEventListener('click', () => imageInput.click());
  imageInput.addEventListener('change', (e) => {
    // Snapshot into a plain array BEFORE touching e.target.value: input.files is
    // not a static copy, it's live against the input's current selection, so
    // clearing value first (to let the same file be reselected later) would
    // empty this reference out from under us before addFiles ever reads it —
    // that was the bug (dialog closes, nothing happens, no error either).
    const files = Array.from(e.target.files || []);
    e.target.value = '';
    addFiles(files);
  });

  const bodyField = document.getElementById('bodyField');
  const bodyTextarea = document.getElementById('body');

  ['dragenter', 'dragover'].forEach((evt) => {
    bodyField.addEventListener(evt, (e) => {
      e.preventDefault();
      bodyField.classList.add('drag-over');
    });
  });
  ['dragleave', 'drop'].forEach((evt) => {
    bodyField.addEventListener(evt, (e) => {
      if (evt === 'dragleave' && bodyField.contains(e.relatedTarget)) return;
      bodyField.classList.remove('drag-over');
    });
  });
  bodyField.addEventListener('drop', (e) => {
    e.preventDefault();
    const files = Array.from(e.dataTransfer?.files || []).filter((f) => f.type.startsWith('image/'));
    if (files.length) addFiles(files);
  });

  bodyTextarea.addEventListener('paste', (e) => {
    const items = Array.from(e.clipboardData?.items || []);
    const imageFiles = items
      .filter((item) => item.kind === 'file' && item.type.startsWith('image/'))
      .map((item) => item.getAsFile())
      .filter(Boolean);
    if (imageFiles.length) addFiles(imageFiles);
    // Deliberately not calling preventDefault(): a copied image normally has no
    // accompanying text/plain payload, so the default paste is a no-op alongside
    // this; if it ever does carry text too, letting that paste through as well
    // is the least surprising behavior.
  });

  function blobToDataUrl(blob) {
    return new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onload = () => resolve(reader.result);
      reader.onerror = () => reject(new Error('이미지 인코딩에 실패했습니다.'));
      reader.readAsDataURL(blob);
    });
  }

  document.getElementById('writeForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const form = e.target;
    const errEl = document.getElementById('writeError');
    const submitBtn = document.getElementById('submitBtn');
    errEl.textContent = '';
    submitBtn.disabled = true;

    try {
      const images = await Promise.all(selectedImages.map((entry) => blobToDataUrl(entry.blob)));

      const res = await fetch('/api/board/create', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          type: 'post',
          category: form.category.value,
          nickname: form.nickname.value,
          title: form.title.value,
          body: form.body.value,
          password: form.password.value,
          honeypot: form.website.value,
          images,
        }),
      });
      const data = await res.json();
      if (!res.ok) {
        errEl.textContent = data.error || '등록에 실패했습니다.';
        submitBtn.disabled = false;
        return;
      }
      location.href = `post.html?id=${encodeURIComponent(data.id)}`;
    } catch (err) {
      errEl.textContent = '등록에 실패했습니다.';
      submitBtn.disabled = false;
    }
  });
</script>
</body>
</html>
