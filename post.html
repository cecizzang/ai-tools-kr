<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>게시판 - 혼AI</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=Inter:wght@400;500;600;700&display=swap');

    :root {
      --bg: #0d0d0f;
      --surface: #141418;
      --border: #1f1f28;
      --text: #e8e8f0;
      --muted: #6b6b80;
      --accent: #7c6af7;
      --red: #f87171;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Inter', sans-serif;
      min-height: 100vh;
      padding: 40px 20px;
    }

    header {
      max-width: 900px;
      margin: 0 auto 32px;
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 16px;
      flex-wrap: wrap;
    }

    .title-block a { text-decoration: none; color: inherit; }

    .title-block h1 {
      font-family: 'IBM Plex Mono', monospace;
      font-size: 22px;
      font-weight: 600;
      letter-spacing: -0.5px;
      color: var(--text);
    }

    .title-block p {
      font-size: 13px;
      color: var(--muted);
      margin-top: 6px;
      font-family: 'IBM Plex Mono', monospace;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: var(--accent);
      color: #fff;
      border: none;
      padding: 8px 16px;
      border-radius: 6px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      font-family: 'IBM Plex Mono', monospace;
      letter-spacing: 0.2px;
      text-decoration: none;
      transition: opacity 0.15s, transform 0.1s;
      white-space: nowrap;
    }

    .btn:hover { opacity: 0.88; }
    .btn:active { transform: scale(0.97); }
    .btn:disabled { opacity: 0.4; cursor: not-allowed; }

    .comment-form button[type="submit"] { align-self: flex-end; }

    .btn.secondary {
      background: var(--surface);
      color: var(--text);
      border: 1px solid var(--border);
    }

    .card {
      max-width: 900px;
      margin: 0 auto 24px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 24px;
    }

    .post-cat {
      font-size: 11px;
      font-family: 'IBM Plex Mono', monospace;
      color: var(--accent);
      margin-bottom: 8px;
    }

    .post-title {
      font-size: 20px;
      font-weight: 700;
      margin-bottom: 8px;
    }

    .post-meta {
      font-size: 12px;
      color: var(--muted);
      font-family: 'IBM Plex Mono', monospace;
      margin-bottom: 16px;
    }

    .post-body {
      font-size: 14px;
      line-height: 1.7;
      white-space: pre-wrap;
      margin-bottom: 20px;
    }

    .not-found {
      max-width: 900px;
      margin: 60px auto;
      text-align: center;
      color: var(--muted);
      font-family: 'IBM Plex Mono', monospace;
    }

    h2 {
      max-width: 900px;
      margin: 0 auto 12px;
      font-size: 14px;
      font-family: 'IBM Plex Mono', monospace;
      color: var(--muted);
    }

    .comment-list {
      max-width: 900px;
      margin: 0 auto 20px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .comment-row {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 14px 16px;
    }

    .comment-meta {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 12px;
      color: var(--muted);
      font-family: 'IBM Plex Mono', monospace;
      margin-bottom: 6px;
    }

    .comment-body {
      font-size: 13px;
      line-height: 1.6;
      white-space: pre-wrap;
    }

    .comment-delete {
      background: none;
      border: none;
      color: var(--muted);
      font-size: 11px;
      font-family: 'IBM Plex Mono', monospace;
      cursor: pointer;
      padding: 0;
    }

    .comment-delete:hover { color: var(--red); }

    .empty {
      max-width: 900px;
      margin: 0 auto 20px;
      color: var(--muted);
      font-family: 'IBM Plex Mono', monospace;
      font-size: 13px;
    }

    form.comment-form {
      max-width: 900px;
      margin: 0 auto;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .form-row { display: flex; gap: 10px; flex-wrap: wrap; }

    input, textarea {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 6px;
      color: var(--text);
      font-family: 'Inter', sans-serif;
      font-size: 13px;
      padding: 8px 10px;
    }

    textarea { resize: vertical; min-height: 60px; font-family: inherit; }

    input:focus, textarea:focus { outline: 1px solid var(--accent); }

    .form-row input { flex: 1; min-width: 120px; }

    .form-error {
      font-size: 12px;
      color: var(--red);
      font-family: 'IBM Plex Mono', monospace;
      min-height: 16px;
    }

    .hp-field { position: absolute; left: -9999px; top: -9999px; }

    .post-images {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-bottom: 20px;
    }

    .post-images img {
      width: 140px;
      height: 140px;
      object-fit: cover;
      border-radius: 8px;
      border: 1px solid var(--border);
      cursor: zoom-in;
    }

    .lightbox {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.85);
      z-index: 100;
      align-items: center;
      justify-content: center;
      padding: 24px;
      cursor: zoom-out;
    }

    .lightbox.open { display: flex; }

    .lightbox img {
      max-width: 100%;
      max-height: 100%;
      border-radius: 6px;
    }
  </style>
</head>
<body>

<header>
  <div class="title-block">
    <a href="index.html"><h1>혼AI</h1></a>
    <p>게시판</p>
  </div>
  <a href="board.html" class="btn secondary">목록</a>
</header>

<div id="postDetail" class="card"></div>

<div class="lightbox" id="lightbox">
  <img id="lightboxImg" src="" alt="" />
</div>

<div id="commentsSection">
  <h2>댓글</h2>
  <div class="comment-list" id="commentList"></div>

  <form class="comment-form" id="commentForm">
    <div class="form-row">
      <input name="nickname" maxlength="12" placeholder="닉네임 (2~12자)" required />
      <input name="password" type="password" maxlength="20" placeholder="비밀번호 (4~20자)" required />
    </div>
    <textarea name="body" maxlength="500" placeholder="댓글 (1~500자)" required></textarea>
    <div class="hp-field"><input name="website" tabindex="-1" autocomplete="off" /></div>
    <div class="form-error" id="commentError"></div>
    <button type="submit" class="btn">댓글 등록</button>
  </form>
</div>

<script>
  const SUPABASE_URL = 'https://clpwrmxegqvzzcqcxdsa.supabase.co';
  const SUPABASE_ANON_KEY = 'sb_publishable_PiSGtCuULXpdHlOgYdWK0A_jmTgqIXQ';
  const CATEGORY_LABELS = { notice: '공지사항', free: '일반', dev: '개발' };
  const POST_ID = new URLSearchParams(location.search).get('id');

  function formatRelativeTime(iso) {
    const diffMin = Math.floor((Date.now() - new Date(iso).getTime()) / 60000);
    if (diffMin < 1) return '방금 전';
    if (diffMin < 60) return `${diffMin}분 전`;
    const diffHour = Math.floor(diffMin / 60);
    if (diffHour < 24) return `${diffHour}시간 전`;
    const diffDay = Math.floor(diffHour / 24);
    return `${diffDay}일 전`;
  }

  function showNotFound() {
    const wrap = document.getElementById('postDetail');
    wrap.className = 'not-found';
    wrap.textContent = '게시글을 찾을 수 없습니다.';
    document.getElementById('commentsSection').style.display = 'none';
  }

  function renderPost(post) {
    const wrap = document.getElementById('postDetail');
    wrap.textContent = '';

    const catEl = document.createElement('div');
    catEl.className = 'post-cat';
    catEl.textContent = CATEGORY_LABELS[post.category] || post.category;

    const titleEl = document.createElement('div');
    titleEl.className = 'post-title';
    titleEl.textContent = post.title;

    const metaEl = document.createElement('div');
    metaEl.className = 'post-meta';
    metaEl.textContent = `${post.nickname} · ${formatRelativeTime(post.created_at)}`;

    const bodyEl = document.createElement('div');
    bodyEl.className = 'post-body';
    bodyEl.textContent = post.body;

    const delBtn = document.createElement('button');
    delBtn.className = 'btn secondary';
    delBtn.textContent = '삭제';
    delBtn.onclick = () => deletePost(post.id);

    wrap.appendChild(catEl);
    wrap.appendChild(titleEl);
    wrap.appendChild(metaEl);
    wrap.appendChild(bodyEl);

    if (Array.isArray(post.image_urls) && post.image_urls.length > 0) {
      const gallery = document.createElement('div');
      gallery.className = 'post-images';
      post.image_urls.forEach((url) => {
        const img = document.createElement('img');
        img.src = url;
        img.alt = post.title;
        img.loading = 'lazy';
        img.onclick = () => openLightbox(url);
        gallery.appendChild(img);
      });
      wrap.appendChild(gallery);
    }

    wrap.appendChild(delBtn);
  }

  function openLightbox(url) {
    document.getElementById('lightboxImg').src = url;
    document.getElementById('lightbox').classList.add('open');
  }

  function closeLightbox() {
    document.getElementById('lightbox').classList.remove('open');
    document.getElementById('lightboxImg').src = '';
  }

  document.getElementById('lightbox').addEventListener('click', closeLightbox);
  document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeLightbox(); });

  async function loadPost() {
    if (!POST_ID) { showNotFound(); return; }

    try {
      const res = await fetch(
        `${SUPABASE_URL}/rest/v1/posts?id=eq.${encodeURIComponent(POST_ID)}&select=id,category,nickname,title,body,image_urls,created_at`,
        { headers: { apikey: SUPABASE_ANON_KEY, Authorization: `Bearer ${SUPABASE_ANON_KEY}` } }
      );
      if (!res.ok) throw new Error(`status ${res.status}`);
      const rows = await res.json();
      const post = rows[0];
      if (!post) { showNotFound(); return; }

      renderPost(post);
      loadComments();
    } catch (err) {
      showNotFound();
    }
  }

  async function deletePost(id) {
    const password = prompt('비밀번호를 입력하세요');
    if (password === null) return;

    const res = await fetch('/api/board/delete', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ type: 'post', id, password }),
    });
    const data = await res.json();
    if (!res.ok) { alert(data.error || '삭제에 실패했습니다.'); return; }
    location.href = 'board.html';
  }

  function buildComment(c) {
    const row = document.createElement('div');
    row.className = 'comment-row';

    const meta = document.createElement('div');
    meta.className = 'comment-meta';

    const metaText = document.createElement('span');
    metaText.textContent = `${c.nickname} · ${formatRelativeTime(c.created_at)}`;

    const delBtn = document.createElement('button');
    delBtn.className = 'comment-delete';
    delBtn.textContent = '삭제';
    delBtn.onclick = () => deleteComment(c.id);

    meta.appendChild(metaText);
    meta.appendChild(delBtn);

    const body = document.createElement('div');
    body.className = 'comment-body';
    body.textContent = c.body;

    row.appendChild(meta);
    row.appendChild(body);
    return row;
  }

  async function loadComments() {
    const listEl = document.getElementById('commentList');
    listEl.textContent = '';

    try {
      const res = await fetch(
        `${SUPABASE_URL}/rest/v1/comments?post_id=eq.${encodeURIComponent(POST_ID)}&select=id,post_id,nickname,body,created_at&order=created_at.asc`,
        { headers: { apikey: SUPABASE_ANON_KEY, Authorization: `Bearer ${SUPABASE_ANON_KEY}` } }
      );
      if (!res.ok) throw new Error(`status ${res.status}`);
      const rows = await res.json();

      if (rows.length === 0) {
        const empty = document.createElement('div');
        empty.className = 'empty';
        empty.textContent = '아직 댓글이 없습니다.';
        listEl.appendChild(empty);
        return;
      }

      rows.forEach((c) => listEl.appendChild(buildComment(c)));
    } catch (err) {
      const empty = document.createElement('div');
      empty.className = 'empty';
      empty.textContent = '댓글을 불러오지 못했습니다.';
      listEl.appendChild(empty);
    }
  }

  async function deleteComment(id) {
    const password = prompt('비밀번호를 입력하세요');
    if (password === null) return;

    const res = await fetch('/api/board/delete', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ type: 'comment', id, password }),
    });
    const data = await res.json();
    if (!res.ok) { alert(data.error || '삭제에 실패했습니다.'); return; }
    loadComments();
  }

  document.getElementById('commentForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const form = e.target;
    const errEl = document.getElementById('commentError');
    errEl.textContent = '';

    const submitBtn = form.querySelector('button[type="submit"]');
    submitBtn.disabled = true;

    try {
      const res = await fetch('/api/board/create', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          type: 'comment',
          postId: POST_ID,
          nickname: form.nickname.value,
          body: form.body.value,
          password: form.password.value,
          honeypot: form.website.value,
        }),
      });
      const data = await res.json();
      if (!res.ok) {
        errEl.textContent = data.error || '등록에 실패했습니다.';
        return;
      }
      form.reset();
      loadComments();
    } catch (err) {
      errEl.textContent = '등록에 실패했습니다.';
    } finally {
      submitBtn.disabled = false;
    }
  });

  loadPost();
</script>
</body>
</html>
