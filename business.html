<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-6N0XZCCW0J"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-6N0XZCCW0J');
  </script>
  <meta name="description" content="가게·1인 사업을 하는 사장님들이 AI 활용 경험을 나누는 공간." />
  <meta property="og:title" content="사장님 모임 - 혼AI" />
  <meta property="og:description" content="가게·1인 사업을 하는 사장님들이 AI 활용 경험을 나누는 공간." />
  <meta property="og:type" content="website" />
  <meta property="og:locale" content="ko_KR" />
  <link rel="canonical" href="https://ai-tools-kr-rho.vercel.app/business.html" />
  <title>사장님 모임 - 혼AI</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=Inter:wght@400;500;600;700&display=swap');

    :root {
      --bg: #0d0d0f;
      --surface: #141418;
      --border: #1f1f28;
      --text: #e8e8f0;
      --muted: #6b6b80;
      --accent: #7c6af7;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Inter', sans-serif;
      min-height: 100vh;
      padding: 40px 20px;
    }

    header {
      max-width: 900px;
      margin: 0 auto 32px;
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 16px;
      flex-wrap: wrap;
    }

    .title-block a { text-decoration: none; color: inherit; }

    .title-block h1 {
      font-family: 'IBM Plex Mono', monospace;
      font-size: 22px;
      font-weight: 600;
      letter-spacing: -0.5px;
      color: var(--text);
    }

    .title-block p {
      font-size: 13px;
      color: var(--muted);
      margin-top: 6px;
      font-family: 'IBM Plex Mono', monospace;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: var(--accent);
      color: #fff;
      border: none;
      padding: 10px 18px;
      border-radius: 6px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      font-family: 'IBM Plex Mono', monospace;
      letter-spacing: 0.2px;
      text-decoration: none;
      transition: opacity 0.15s, transform 0.1s;
      white-space: nowrap;
    }

    .btn:hover { opacity: 0.88; }
    .btn:active { transform: scale(0.97); }

    .btn.secondary {
      background: var(--surface);
      color: var(--text);
      border: 1px solid var(--border);
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .post-list {
      max-width: 900px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 1px;
      background: var(--border);
      border: 1px solid var(--border);
      border-radius: 10px;
      overflow: hidden;
    }

    .post-row {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 14px 20px;
      background: var(--surface);
      text-decoration: none;
      color: var(--text);
    }

    .post-row:hover { background: #1a1a20; }

    .post-row .main {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .post-row .title,
    .post-row .preview {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .post-row .title { font-size: 14px; }

    .post-row .preview {
      font-size: 12px;
      color: var(--muted);
    }

    .post-row .count {
      color: var(--accent);
      font-family: 'IBM Plex Mono', monospace;
      font-size: 12px;
      flex-shrink: 0;
    }

    .section {
      max-width: 900px;
      margin: 0 auto 24px;
    }

    .section-head {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 10px;
    }

    .section-head h2 {
      font-family: 'IBM Plex Mono', monospace;
      font-size: 13px;
      font-weight: 600;
      color: var(--muted);
      letter-spacing: 0.2px;
    }

    .intro-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-left: 3px solid var(--accent);
      border-radius: 10px;
      padding: 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      flex-wrap: wrap;
    }

    .intro-card .lead {
      font-size: 16px;
      font-weight: 600;
      line-height: 1.5;
    }

    .intro-card .sub {
      font-size: 13px;
      color: var(--muted);
      margin-top: 6px;
    }

    .tool-strip {
      display: flex;
      gap: 10px;
      overflow-x: auto;
      padding-bottom: 6px;
      scroll-snap-type: x proximity;
      -webkit-overflow-scrolling: touch;
    }

    .tool-card {
      flex: 0 0 180px;
      scroll-snap-align: start;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 14px;
      text-decoration: none;
      color: var(--text);
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .tool-card:hover,
    .shortcut:hover,
    .prompt:hover { border-color: var(--accent); }

    .tool-card .name {
      font-size: 14px;
      font-weight: 600;
    }

    .tool-card .desc {
      font-size: 12px;
      color: var(--muted);
      line-height: 1.5;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .tool-card.more {
      flex-basis: 120px;
      align-items: center;
      justify-content: center;
      color: var(--accent);
      font-family: 'IBM Plex Mono', monospace;
      font-size: 13px;
      white-space: nowrap;
    }

    .shortcuts {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
    }

    .shortcut {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 14px;
      text-decoration: none;
      color: var(--text);
    }

    .shortcut .label {
      font-size: 14px;
      font-weight: 600;
    }

    .shortcut .label::after {
      content: ' →';
      color: var(--accent);
    }

    .shortcut .hint {
      font-size: 12px;
      color: var(--muted);
      margin-top: 4px;
    }

    .prompts { margin-top: 24px; }

    .prompt-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .prompt {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      background: transparent;
      border: 1px dashed var(--border);
      border-radius: 10px;
      padding: 12px 16px;
      text-decoration: none;
      color: var(--text);
      font-size: 14px;
    }

    .prompt .go {
      color: var(--accent);
      font-family: 'IBM Plex Mono', monospace;
      font-size: 12px;
      flex-shrink: 0;
    }

    [hidden] { display: none !important; }

    @media (max-width: 600px) {
      .shortcuts { grid-template-columns: 1fr; }
      .tool-card { flex-basis: 150px; }
      .intro-card .btn { width: 100%; justify-content: center; }
      .post-row { flex-wrap: wrap; row-gap: 6px; padding: 14px 16px; }
      .post-row .main { flex-basis: 100%; }
    }

    .post-row .meta {
      font-size: 12px;
      color: var(--muted);
      font-family: 'IBM Plex Mono', monospace;
      flex-shrink: 0;
    }

    .empty {
      max-width: 900px;
      margin: 40px auto;
      text-align: center;
      color: var(--muted);
      font-family: 'IBM Plex Mono', monospace;
      font-size: 13px;
    }

    .post-list .empty {
      max-width: none;
      margin: 0;
      padding: 32px 20px;
      background: var(--surface);
    }

    .pagination {
      max-width: 900px;
      margin: 20px auto 0;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 16px;
      font-family: 'IBM Plex Mono', monospace;
      font-size: 13px;
      color: var(--muted);
    }

    .pagination a { color: var(--text); text-decoration: none; }
    .pagination a:hover { color: var(--accent); }
    /* 공통: 한국어가 단어 중간에서 끊기지 않게 + 아이폰에서 입력창 누를 때 화면 확대 방지 */
    body { word-break: keep-all; overflow-wrap: anywhere; }
    @media (max-width: 600px) {
      input, textarea, select { font-size: 16px !important; }
    }
  </style>
</head>
<body>

<header>
  <div class="title-block">
    <a href="index.html"><h1>혼AI</h1></a>
    <p>사장님 모임</p>
  </div>
  <div class="header-actions">
    <a href="board.html" class="btn secondary">게시판</a>
    <a href="write.html?category=business" class="btn">글쓰기</a>
  </div>
</header>

<section class="section intro-card" id="introCard">
  <div>
    <p class="lead">가게·1인 사업 하시는 분들이 AI로 일 줄이는 방법을 나누는 곳</p>
    <p class="sub">써보신 AI 활용법, 질문 아무거나 환영해요.</p>
  </div>
  <a href="write.html?category=business" class="btn">글 남기기</a>
</section>

<section class="section" id="toolSection" hidden>
  <div class="section-head"><h2>사장님 추천 툴</h2></div>
  <div class="tool-strip" id="toolStrip"></div>
</section>

<section class="section">
  <div class="section-head"><h2>바로가기</h2></div>
  <div class="shortcuts" id="shortcuts"></div>
</section>

<section class="section">
  <div class="section-head"><h2>사장님들의 글</h2></div>
  <div class="post-list" id="postList"></div>
  <div class="prompts" id="prompts" hidden>
    <div class="section-head"><h2>이런 글을 기다려요</h2></div>
    <div class="prompt-list" id="promptList"></div>
  </div>
  <div class="pagination" id="pagination"></div>
</section>

<script src="business.js"></script>
<script>
  const SUPABASE_URL = 'https://clpwrmxegqvzzcqcxdsa.supabase.co';
  const SUPABASE_ANON_KEY = 'sb_publishable_PiSGtCuULXpdHlOgYdWK0A_jmTgqIXQ';
  const PAGE_SIZE = 20;
  const CATEGORY = 'business';

  function getParams() {
    const p = new URLSearchParams(location.search);
    return { page: Math.max(1, parseInt(p.get('page') || '1', 10) || 1) };
  }

  function formatRelativeTime(iso) {
    const diffMin = Math.floor((Date.now() - new Date(iso).getTime()) / 60000);
    if (diffMin < 1) return '방금 전';
    if (diffMin < 60) return `${diffMin}분 전`;
    const diffHour = Math.floor(diffMin / 60);
    if (diffHour < 24) return `${diffHour}시간 전`;
    const diffDay = Math.floor(diffHour / 24);
    return `${diffDay}일 전`;
  }

  function buildRow(row) {
    const a = document.createElement('a');
    a.className = 'post-row';
    a.href = `post.html?id=${encodeURIComponent(row.id)}`;

    const main = document.createElement('span');
    main.className = 'main';

    const title = document.createElement('span');
    title.className = 'title';
    title.textContent = row.title;
    main.appendChild(title);

    const previewText = BusinessPage.previewText(row.body);
    if (previewText) {
      const preview = document.createElement('span');
      preview.className = 'preview';
      preview.textContent = previewText;
      main.appendChild(preview);
    }

    const count = document.createElement('span');
    count.className = 'count';
    count.textContent = `댓글 ${row.comments?.length || 0}`;

    const meta = document.createElement('span');
    meta.className = 'meta';
    meta.textContent = `${row.nickname} · ${formatRelativeTime(row.created_at)}`;

    a.appendChild(main);
    a.appendChild(count);
    a.appendChild(meta);
    return a;
  }

  function el(tag, className, text) {
    const node = document.createElement(tag);
    node.className = className;
    if (text !== undefined) node.textContent = text;
    return node;
  }

  function renderShortcuts() {
    const container = document.getElementById('shortcuts');
    BusinessPage.SHORTCUTS.forEach((shortcut) => {
      const a = el('a', 'shortcut');
      a.href = shortcut.href;
      a.appendChild(el('div', 'label', shortcut.label));
      a.appendChild(el('div', 'hint', shortcut.hint));
      container.appendChild(a);
    });
  }

  function renderPrompts(total) {
    const section = document.getElementById('prompts');
    const list = document.getElementById('promptList');
    list.textContent = '';
    section.hidden = !BusinessPage.shouldShowPrompts(total);
    if (section.hidden) return;
    BusinessPage.PROMPTS.forEach((title) => {
      const a = el('a', 'prompt');
      a.href = BusinessPage.writeLink(title);
      a.appendChild(el('span', '', title));
      a.appendChild(el('span', 'go', '이 제목으로 쓰기 →'));
      list.appendChild(a);
    });
  }

  // 추천 툴을 못 불러오거나 조건에 맞는 툴이 없으면 줄 자체를 숨겨 둔다.
  async function loadTools() {
    try {
      const res = await fetch(BusinessPage.recommendedToolsUrl(SUPABASE_URL), {
        headers: { apikey: SUPABASE_ANON_KEY, Authorization: `Bearer ${SUPABASE_ANON_KEY}` },
      });
      if (!res.ok) return;
      const tools = await res.json();
      if (!Array.isArray(tools) || tools.length === 0) return;

      const strip = document.getElementById('toolStrip');
      tools.forEach((tool) => {
        const a = el('a', 'tool-card');
        a.href = BusinessPage.toolLink(tool.category);
        a.appendChild(el('span', 'name', tool.name));
        a.appendChild(el('span', 'desc', tool.description));
        strip.appendChild(a);
      });
      const more = el('a', 'tool-card more', '전체 보기 →');
      more.href = 'tools.html?target=biz';
      strip.appendChild(more);
      document.getElementById('toolSection').hidden = false;
    } catch (err) {
      // 추천 툴은 부가 요소라 실패해도 글 목록은 그대로 보여 준다.
    }
  }

  function renderPagination(page, total) {
    const el = document.getElementById('pagination');
    el.textContent = '';
    const totalPages = Math.max(1, Math.ceil(total / PAGE_SIZE));

    if (page > 1) {
      const prev = document.createElement('a');
      prev.textContent = '이전';
      prev.href = `business.html?page=${page - 1}`;
      el.appendChild(prev);
    } else {
      const span = document.createElement('span');
      span.textContent = '이전';
      span.style.opacity = '0.4';
      el.appendChild(span);
    }

    const info = document.createElement('span');
    info.textContent = `${page} / ${totalPages}`;
    el.appendChild(info);

    if (page < totalPages) {
      const next = document.createElement('a');
      next.textContent = '다음';
      next.href = `business.html?page=${page + 1}`;
      el.appendChild(next);
    } else {
      const span = document.createElement('span');
      span.textContent = '다음';
      span.style.opacity = '0.4';
      el.appendChild(span);
    }
  }

  async function fetchPosts(url) {
    const res = await fetch(url, {
      headers: {
        apikey: SUPABASE_ANON_KEY,
        Authorization: `Bearer ${SUPABASE_ANON_KEY}`,
        Prefer: 'count=exact',
      },
    });
    if (!res.ok) throw new Error(`status ${res.status}`);
    const rows = await res.json();
    const range = res.headers.get('content-range');
    const total = range ? parseInt(range.split('/')[1], 10) : rows.length;
    return { rows, total };
  }

  async function loadPosts() {
    const { page } = getParams();
    const offset = (page - 1) * PAGE_SIZE;
    const select = 'select=id,category,nickname,title,body,created_at,comments(id)';
    const url = `${SUPABASE_URL}/rest/v1/posts?${select}&category=eq.${CATEGORY}&order=created_at.desc&limit=${PAGE_SIZE}&offset=${offset}`;

    const listEl = document.getElementById('postList');
    listEl.textContent = '';

    try {
      const { rows, total } = await fetchPosts(url);

      if (rows.length === 0) {
        const empty = document.createElement('div');
        empty.className = 'empty';
        empty.textContent = '아직 게시글이 없습니다.';
        listEl.appendChild(empty);
      } else {
        rows.forEach((row) => listEl.appendChild(buildRow(row)));
      }

      renderPrompts(total);
      renderPagination(page, total);
    } catch (err) {
      listEl.textContent = '';
      const empty = document.createElement('div');
      empty.className = 'empty';
      empty.textContent = '목록을 불러오지 못했습니다.';
      listEl.appendChild(empty);
    }
  }

  renderShortcuts();
  loadTools();
  loadPosts();
</script>
</body>
</html>
